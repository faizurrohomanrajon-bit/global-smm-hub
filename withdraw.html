
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080f1d">
<title>Withdrawal | GLOBAL EARNING</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080f1d;color:#fff;font-family:Arial,sans-serif;padding-bottom:90px}
header{padding:18px;background:#0b1728;border-bottom:1px solid #263b50}
.logo{font-size:20px;font-weight:bold;color:#4ade80}
main{max-width:650px;margin:auto;padding:20px}
.hero{padding:23px;background:linear-gradient(130deg,#155c43,#142d4c);border:1px solid #267c58;border-radius:17px}
.hero h2{margin-bottom:10px}
.hero p{font-size:13px;color:#d1fae5}
.balance{font-size:34px;color:#4ade80;font-weight:bold;margin-top:15px}
.card{margin-top:18px;background:#111f33;border:1px solid #263e59;border-radius:15px;padding:19px}
.card h3{color:#4ade80;margin-bottom:17px}
label{display:block;font-size:13px;color:#cbd5e1;margin:15px 0 7px}
input,select{width:100%;padding:13px;background:#081527;border:1px solid #34465d;border-radius:9px;color:white;font-size:14px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#4ade80;color:#052e20;font-weight:bold;margin-top:17px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.note{font-size:12px;color:#94a3b8;line-height:1.7;margin-top:12px}
.minimum{font-size:13px;color:#4ade80;margin-top:9px}
.item{padding:13px 0;border-bottom:1px solid #293c54;font-size:12px;line-height:1.8;overflow-wrap:anywhere}
.status{font-size:12px;color:#94a3b8;margin-top:12px;line-height:1.6;overflow-wrap:anywhere}
.pending{color:#fbbf24}
.approved{color:#4ade80}
.rejected{color:#f87171}
.paid{color:#60a5fa}
nav{position:fixed;bottom:0;left:0;right:0;background:#081221;border-top:1px solid #29415b;display:flex;justify-content:space-around;padding:11px 3px;z-index:10}
nav a{color:#91a2b8;text-decoration:none;text-align:center;font-size:10px;flex:1}
nav a span{display:block;font-size:20px;margin-bottom:5px}
nav a.active{color:#4ade80}
@media(max-width:400px){main{padding:15px}.balance{font-size:30px}}
</style>
</head>

<body>

<header>
 <div class="logo">🌍 GLOBAL EARNING</div>
</header>

<main>

<section class="hero">
 <h2>💸 Withdraw Your Earnings</h2>
 <p>আপনার উপলব্ধ USD Wallet Balance</p>
 <div class="balance" id="balance">$0.00</div>
 <p id="pending">Pending: $0.00</p>
</section>

<section class="card">
 <h3>📝 Withdrawal Request</h3>

 <label>Payment Method</label>
 <select id="method">
  <option value="bKash">bKash</option>
  <option value="Nagad">Nagad</option>
  <option value="USDT BEP20">USDT BEP20</option>
 </select>

 <label>Withdrawal Amount (USD)</label>
 <input id="amount" type="number" min="1" max="1000000"
 step="0.01" inputmode="decimal"
 placeholder="সর্বনিম্ন 1.00 USD">

 <p class="minimum">সর্বনিম্ন Withdrawal: $1.00</p>

 <label id="addressLabel">bKash Number</label>
 <input id="address" type="text" maxlength="200"
 autocomplete="off" placeholder="আপনার bKash Number">

 <p class="note" id="networkNote">
 আপনার নিজের পেমেন্ট অ্যাকাউন্টের তথ্য দিন।
 </p>

 <button type="button" id="submitBtn">
 Submit Withdrawal Request
 </button>

 <p class="status" id="message"></p>
</section>

<section class="card">
 <h3>📋 Withdrawal History</h3>
 <div id="history">Loading history...</div>
</section>

</main>

<nav>
 <a href="dashboard.html"><span>🏠</span>Home</a>
 <a href="wallet.html"><span>💰</span>Wallet</a>
 <a href="tasks.html"><span>📋</span>Tasks</a>
 <a href="referral.html"><span>🤝</span>Referral</a>
 <a href="profile.html"><span>👤</span>Profile</a>
</nav>

<script>
const SUPABASE_URL="https://hbvtnlwwafmwdfaibrrz.supabase.co";
const SUPABASE_KEY="sb_publishable_PBEsz-_TswIKq8W3rTFaOg_UVAbfPTk";

const db=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

let user=null;
let walletBalance=0;
let submitting=false;

const el=id=>document.getElementById(id);
const MIN_WITHDRAWAL=1.00;

function money(value){
 const number=Number(value||0);
 return "$"+(Number.isFinite(number)?number:0).toFixed(2);
}

function escapeHtml(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function showMessage(text,color="#fbbf24"){
 el("message").textContent=text;
 el("message").style.color=color;
}

function updateFields(){

 const method=el("method").value;

 if(method==="USDT BEP20"){
  el("addressLabel").textContent="USDT BEP20 Wallet Address";
  el("address").placeholder="আপনার BEP20 Address";
  el("networkNote").textContent=
   "শুধুমাত্র BNB Smart Chain (BEP20) Network।";
 }else{
  el("addressLabel").textContent=method+" Number";
  el("address").placeholder="আপনার "+method+" Number";
  el("networkNote").textContent=
   "আপনার নিজের "+method+" অ্যাকাউন্টের তথ্য দিন।";
 }

 el("address").value="";
}

async function loadWallet(){

 const {data,error}=await db
  .from("wallets")
  .select("balance,pending_balance")
  .eq("user_id",user.id)
  .eq("currency","USD")
  .maybeSingle();

 if(error)throw error;

 if(!data){
  throw new Error("আপনার USD Wallet তৈরি হয়নি।");
 }

 walletBalance=Number(data.balance||0);

 el("balance").textContent=money(walletBalance);
 el("pending").textContent=
  "Pending: "+money(data.pending_balance);
}

async function loadHistory(){

 const {data,error}=await db
  .from("withdrawal_requests")
  .select("amount,method,status,created_at")
  .eq("user_id",user.id)
  .order("created_at",{ascending:false})
  .limit(50);

 if(error)throw error;

 if(!data||data.length===0){
  el("history").textContent=
   "এখনো কোনো Withdrawal Request নেই।";
  return;
 }

 el("history").innerHTML=data.map(item=>{

  const status=String(item.status||"pending").toLowerCase();

  let statusClass="pending";

  if(status==="approved")statusClass="approved";
  if(status==="rejected")statusClass="rejected";
  if(status==="paid")statusClass="paid";

  const date=item.created_at
   ?new Date(item.created_at).toLocaleString()
   :"";

  return `
   <div class="item">
    <b>${money(item.amount)}</b><br>
    Method: ${escapeHtml(item.method)}<br>
    Status:
    <span class="${statusClass}">
     ${escapeHtml(item.status)}
    </span><br>
    ${escapeHtml(date)}
   </div>
  `;

 }).join("");
}

async function loadPage(){

 try{

  const {data,error}=await db.auth.getUser();

  if(error||!data.user){
   location.replace("login.html");
   return;
  }

  user=data.user;

  await loadWallet();
  await loadHistory();

 }catch(error){

  console.error(error);

  showMessage(
   error.message||"Wallet তথ্য লোড করা যায়নি।",
   "#f87171"
  );

  el("history").textContent="History load failed.";

 }
}

async function submitWithdrawal(){

 if(submitting)return;

 const btn=el("submitBtn");
 const amount=Number(el("amount").value);
 const method=el("method").value;
 const address=el("address").value.trim();

 showMessage("");

 if(!user){
  showMessage("প্রথমে Login করুন।","#f87171");
  return;
 }

 if(!Number.isFinite(amount)||amount<MIN_WITHDRAWAL){
  showMessage(
   "সর্বনিম্ন Withdrawal Amount হলো $1.00।",
   "#f87171"
  );
  return;
 }

 if(Math.abs(amount*100-Math.round(amount*100))>0.000001){
  showMessage(
   "সর্বোচ্চ দুই দশমিক পর্যন্ত Amount দিন।",
   "#f87171"
  );
  return;
 }

 if(amount>walletBalance){
  showMessage(
   "আপনার Available Balance যথেষ্ট নয়।",
   "#f87171"
  );
  return;
 }

 if(!address||address.length<5||address.length>200){
  showMessage(
   "সঠিক Payment Address বা Number লিখুন।",
   "#f87171"
  );
  return;
 }

 if(!["bKash","Nagad","USDT BEP20"].includes(method)){
  showMessage("সঠিক Payment Method নির্বাচন করুন।","#f87171");
  return;
 }

 if(!confirm(
  "আপনার Withdrawal Request জমা দিতে চান?\n"+
  "Amount: "+money(amount)+"\n"+
  "Method: "+method
 )){
  return;
 }

 submitting=true;
 btn.disabled=true;
 btn.textContent="Submitting...";

 showMessage("Request জমা হচ্ছে...");

 let requestCreated=false;

 try{

  const {data,error}=await db.rpc(
   "create_withdrawal_request",
   {
    p_amount:amount,
    p_method:method,
    p_payout_address:address
   }
  );

  if(error)throw error;

  requestCreated=true;

  el("amount").value="";
  el("address").value="";

  showMessage(
   "✓ Withdrawal Request সফলভাবে জমা হয়েছে। Admin যাচাই করবেন।",
   "#4ade80"
  );

  // Request সফল হওয়ার পর Refresh ব্যর্থ হলেও
  // Request-কে ব্যর্থ বলা হবে না।
  try{
   await loadWallet();
  }catch(refreshError){
   console.error("Wallet refresh:",refreshError);
  }

  try{
   await loadHistory();
  }catch(refreshError){
   console.error("History refresh:",refreshError);
   el("history").textContent=
    "Request জমা হয়েছে। History পরে আবার দেখুন।";
  }

 }catch(error){

  console.error(error);

  showMessage(
   requestCreated
    ?"Request জমা হয়েছে। তবে পেজ রিফ্রেশে সমস্যা হয়েছে।"
    :"Request ব্যর্থ: "+(error.message||"আবার চেষ্টা করুন।"),
   requestCreated?"#4ade80":"#f87171"
  );

 }finally{

  submitting=false;
  btn.disabled=false;
  btn.textContent="Submit Withdrawal Request";

 }

}

el("method").addEventListener("change",updateFields);
el("submitBtn").addEventListener("click",submitWithdrawal);

updateFields();
loadPage();

</script>

</body>
  </html>
