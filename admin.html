
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLOBAL EARNING - Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#080f1d;color:#fff;font-family:Arial,sans-serif}
.container{max-width:850px;margin:auto}
h1{color:#4ade80}
.card{background:#111d30;border:1px solid #26364d;border-radius:14px;padding:18px;margin:15px 0;overflow-wrap:anywhere}
.muted{color:#9aabc1;font-size:13px}
input,textarea,select{width:100%;padding:13px;margin:7px 0 14px;background:#081321;color:white;border:1px solid #354761;border-radius:8px;font-size:15px}
textarea{min-height:90px;resize:vertical}
label{font-size:14px;color:#d1d5db}
button{background:#4ade80;color:#07111d;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:5px}
button:disabled{opacity:.5;cursor:not-allowed}
.refresh{background:#26364d;color:white}
.reject{background:#ef4444;color:white}
.paid{background:#38bdf8;color:#07111d}
.verify{background:#fbbf24;color:#172033}
.status{color:#4ade80}
.proof{background:#081321;padding:12px;border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.detail{font-size:13px;line-height:1.8;color:#d1d5db;overflow-wrap:anywhere}
.primary{width:100%;padding:14px;font-size:16px}
</style>
</head>
<body>
<div class="container">

<h1>GLOBAL EARNING 🌍</h1>
<h2>Admin Panel</h2>
<p class="muted">Task Management, Worker Submission & Withdrawal Review</p>

<div class="card">
<h3>Admin Status</h3>
<p id="adminStatus">Checking...</p>
<button class="refresh" onclick="refreshAll()">Refresh Data</button>
<button class="refresh" onclick="logout()">Logout</button>
</div>

<!-- CREATE TASK -->
<h2>➕ Create New Task</h2>
<div class="card">
<form id="taskForm">

<label>কাজের বিভাগ</label>
<select id="taskCategory" required>
<option value="">বিভাগ নির্বাচন করুন</option>
<option value="Typing">Typing</option>
<option value="Data Entry">Data Entry</option>
<option value="PDF to Word">PDF to Word</option>
<option value="Product Listing">Product Listing</option>
<option value="Website Testing">Website Testing</option>
</select>

<label>কাজের নাম</label>
<input id="taskTitle" placeholder="যেমন: ৫ পৃষ্ঠার Typing কাজ" required>

<label>কাজের বিবরণ</label>
<textarea id="taskDescription" placeholder="Worker-কে কী করতে হবে লিখুন" required></textarea>

<label>কাজের লিংক (ঐচ্ছিক)</label>
<input id="taskUrl" type="url" placeholder="https://example.com">

<label>কাজের নিয়ম ও নির্দেশনা</label>
<textarea id="taskRequirements" placeholder="কীভাবে কাজ জমা দিতে হবে লিখুন" required></textarea>

<label>প্রতি Worker-এর পারিশ্রমিক (USD)</label>
<input id="taskReward" type="number" min="0.01" step="0.01" placeholder="যেমন: 2" required>

<label>কতজন Worker কাজ করবে?</label>
<input id="taskWorkers" type="number" min="1" step="1" placeholder="যেমন: 5" required>

<label>মোট Worker Reward Budget (USD)</label>
<input id="taskBudget" readonly placeholder="স্বয়ংক্রিয় হিসাব">

<p class="muted">মোট বাজেট = প্রতি Worker-এর পারিশ্রমিক × Worker সংখ্যা।</p>

<button class="primary" id="createTaskBtn" type="submit">Create Task</button>
<p id="taskMessage" class="muted"></p>
</form>
</div>

<h2>Pending Submissions</h2>
<div id="message" class="muted">Loading...</div>
<div id="submissions"></div>

<h2>💸 Withdrawal Requests</h2>
<p class="muted">Pending ও Approved Request এখানে দেখাবে।</p>
<div id="withdrawalMessage" class="muted">Loading...</div>
<div id="withdrawals"></div>

<div id="buyerTasks"></div>
</div>

<script>
const SUPABASE_URL="https://hbvtnlwwafmwdfaibrrz.supabase.co";
const SUPABASE_KEY="sb_publishable_PBEsz-_TswIKq8W3rTFaOg_UVAbfPTk";

const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const message=document.getElementById("message");
const submissions=document.getElementById("submissions");
const withdrawalMessage=document.getElementById("withdrawalMessage");
const withdrawals=document.getElementById("withdrawals");

let adminVerified=false;
let currentAdminUser=null;

function safe(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#039;"
 })[c]);
}

async function start(){
 try{
  const {data:{user},error}=await db.auth.getUser();

  if(error||!user){
   document.getElementById("adminStatus").textContent="Login নেই।";
   message.textContent="Please login first.";
   return;
  }

  const {data:isAdmin,error:adminError}=await db.rpc("is_admin");

  if(adminError){
   document.getElementById("adminStatus").textContent=
    "Admin যাচাই Error: "+adminError.message;
   return;
  }

  if(isAdmin!==true){
   document.getElementById("adminStatus").textContent="Access denied.";
   return;
  }

  currentAdminUser=user;
  adminVerified=true;

  document.getElementById("adminStatus").innerHTML=
   '<span class="status">Admin verified ✓</span>';

  await refreshAll();
 }catch(error){
  document.getElementById("adminStatus").textContent="Error: "+error.message;
 }
}

async function refreshAll(){
 if(!adminVerified)return;
 await loadSubmissions();
 await loadWithdrawalRequests();
 await loadBuyerTasks();
}

/* AUTO CALCULATE TASK BUDGET */
function calculateBudget(){
 const reward=Number(document.getElementById("taskReward").value);
 const workers=Number(document.getElementById("taskWorkers").value);

 document.getElementById("taskBudget").value=
  reward>0&&workers>0?(reward*workers).toFixed(2):"";
}

document.getElementById("taskReward").addEventListener("input",calculateBudget);
document.getElementById("taskWorkers").addEventListener("input",calculateBudget);

/* CREATE TASK */
document.getElementById("taskForm").addEventListener("submit",async function(e){
 e.preventDefault();

 if(!adminVerified||!currentAdminUser){
  alert("Admin verification নেই।");
  return;
 }

 const category=document.getElementById("taskCategory").value;
 const title=document.getElementById("taskTitle").value.trim();
 const description=document.getElementById("taskDescription").value.trim();
 const jobUrl=document.getElementById("taskUrl").value.trim();
 const requirements=document.getElementById("taskRequirements").value.trim();
 const reward=Number(document.getElementById("taskReward").value);
 const workers=Number(document.getElementById("taskWorkers").value);
 const budget=reward*workers;

 const allowedCategories=[
  "Typing","Data Entry","PDF to Word",
  "Product Listing","Website Testing"
 ];

 if(!allowedCategories.includes(category)){
  alert("সঠিক কাজের বিভাগ নির্বাচন করুন।");
  return;
 }

 if(!title||!description||!requirements||!Number.isFinite(reward)||!Number.isInteger(workers)||reward<=0||workers<1){
  alert("সব তথ্য সঠিকভাবে পূরণ করুন।");
  return;
 }

 if(jobUrl){
  try{
   const parsed=new URL(jobUrl);
   if(!["http:","https:"].includes(parsed.protocol))throw new Error();
  }catch{
   alert("সঠিক Website URL দিন।");
   return;
  }
 }

 const button=document.getElementById("createTaskBtn");
 const taskMessage=document.getElementById("taskMessage");

 button.disabled=true;
 button.textContent="Creating...";
 taskMessage.textContent="কাজ তৈরি হচ্ছে...";

 const taskData={
  buyer_id:currentAdminUser.id,
  category:category,
  title:title,
  description:description,
  job_url:jobUrl||null,
  requirements:requirements,
  reward_per_worker:reward,
  workers_needed:workers,
  total_budget:budget,
  currency:"USD",
  status:"draft",
  payment_verified:false
 };

 const {data,error}=await db.from("tasks")
  .insert(taskData)
  .select("id")
  .single();

 button.disabled=false;
 button.textContent="Create Task";

 if(error){
  taskMessage.textContent="Error: "+error.message;
  alert("Task তৈরি হয়নি: "+error.message);
  return;
 }

 taskMessage.textContent="Task তৈরি হয়েছে। Payment যাচাইয়ের জন্য Pending আছে।";
 alert("Task তৈরি হয়েছে! এখন Pending Tasks থেকে পেমেন্ট যাচাই করে Activate করতে পারবেন।");

 document.getElementById("taskForm").reset();
 document.getElementById("taskBudget").value="";

 await loadBuyerTasks();
});

/* WORKER SUBMISSIONS */
async function loadSubmissions(){
 message.textContent="Loading submissions...";
 submissions.innerHTML="";

 const {data,error}=await db.from("task_submissions")
  .select(`
   id,task_id,worker_id,evidence,status,submitted_at,
   tasks(title,reward_per_worker,currency)
  `)
  .eq("status","pending")
  .order("submitted_at",{ascending:true});

 if(error){
  message.textContent="Error: "+error.message;
  return;
 }

 if(!data||data.length===0){
  message.textContent="কোনো Pending Submission নেই।";
  return;
 }

 message.textContent=data.length+"টি Pending Submission";

 data.forEach(item=>{
  const task=item.tasks||{};
  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
   <h3>${safe(task.title||"Untitled Task")}</h3>
   <p class="muted">Submission ID: ${safe(item.id)}</p>
   <p>Worker ID: ${safe(item.worker_id)}</p>
   <p>Reward: $${safe(task.reward_per_worker)} ${safe(task.currency)}</p>
   <p>Submitted: ${safe(item.submitted_at?new Date(item.submitted_at).toLocaleString():"Unknown")}</p>
   <h4>Worker Proof</h4>
   <div class="proof">${safe(item.evidence||"No proof provided")}</div>
   <button class="approve">Approve & Pay</button>
  `;

  card.querySelector(".approve").onclick=()=>approve(
   item.id,card.querySelector(".approve")
  );
  submissions.appendChild(card);
 });
}

async function approve(id,button){
 if(!confirm("Submission অনুমোদন করে Worker-কে USD Reward দিতে চান?"))return;

 button.disabled=true;
 button.textContent="Processing...";

 const {data,error}=await db.rpc("approve_task_and_pay_worker",{
  p_submission_id:id
 });

 if(error){
  alert("Approval failed: "+error.message);
  button.disabled=false;
  button.textContent="Approve & Pay";
  return;
 }

 alert("Approved! Worker balance: $"+data);
 await loadSubmissions();
}

/* WITHDRAWAL REQUESTS */
async function loadWithdrawalRequests(){
 withdrawalMessage.textContent="Loading Withdrawal Requests...";
 withdrawals.innerHTML="";

 const {data,error}=await db.from("withdrawal_requests")
  .select("id,user_id,amount,currency,method,payout_address,status,created_at")
  .in("status",["pending","approved"])
  .order("created_at",{ascending:true});

 if(error){
  withdrawalMessage.textContent="Withdrawal Error: "+error.message;
  return;
 }

 if(!data||data.length===0){
  withdrawalMessage.textContent="কোনো Pending বা Approved Withdrawal নেই।";
  return;
 }

 withdrawalMessage.textContent=data.length+"টি Withdrawal Request";

 data.forEach(item=>{
  const card=document.createElement("div");
  card.className="card";

  card.innerHTML=`
   <h3>💸 ${safe(item.method)}</h3>
   <div class="detail">
    <p>Request ID: ${safe(item.id)}</p>
    <p>Worker ID: ${safe(item.user_id)}</p>
    <p>Amount: $${safe(Number(item.amount).toFixed(2))} ${safe(item.currency)}</p>
    <p>Payment Details: ${safe(item.payout_address)}</p>
    <p>Status: <strong>${safe(item.status.toUpperCase())}</strong></p>
    <p>Created: ${safe(new Date(item.created_at).toLocaleString())}</p>
   </div>
   <div class="actions"></div>
  `;

  const actions=card.querySelector(".actions");

  if(item.status==="pending"){
   const approveBtn=document.createElement("button");
   approveBtn.textContent="Approve";
   approveBtn.onclick=()=>reviewWithdrawal(item.id,"approve",approveBtn);

   const rejectBtn=document.createElement("button");
   rejectBtn.textContent="Reject & Refund";
   rejectBtn.className="reject";
   rejectBtn.onclick=()=>reviewWithdrawal(item.id,"reject",rejectBtn);

   actions.append(approveBtn,rejectBtn);
  }

  if(item.status==="approved"){
   const paidBtn=document.createElement("button");
   paidBtn.textContent="Mark Paid";
   paidBtn.className="paid";
   paidBtn.onclick=()=>reviewWithdrawal(item.id,"paid",paidBtn);

   const note=document.createElement("p");
   note.className="muted";
   note.textContent="বাস্তবে টাকা পাঠানোর পরেই Mark Paid চাপুন।";

   actions.append(note,paidBtn);
  }

  withdrawals.appendChild(card);
 });
}

async function reviewWithdrawal(id,action,button){
 const prompts={
  approve:"এই Withdrawal Request অনুমোদন করবেন?",
  reject:"Request বাতিল করে Worker-এর ব্যালেন্স ফেরত দেবেন?",
  paid:"বাস্তবে টাকা পাঠানো হয়ে থাকলেই Paid করুন। টাকা পাঠিয়েছেন?"
 };

 if(!confirm(prompts[action]))return;

 button.disabled=true;
 button.textContent="Processing...";

 const {data,error}=await db.rpc("review_withdrawal_request",{
  p_request_id:id,p_action:action
 });

 if(error){
  alert("Withdrawal Error: "+error.message);
  button.disabled=false;
  button.textContent=action==="approve"?"Approve":
   action==="reject"?"Reject & Refund":"Mark Paid";
  return;
 }

 alert(data||"Request updated successfully");
 await loadWithdrawalRequests();
}

/* PENDING TASKS */
async function loadBuyerTasks(){
 const box=document.getElementById("buyerTasks");
 box.innerHTML="<h2>Pending Tasks - Payment Review</h2>";

 const {data,error}=await db.from("tasks")
  .select("id,title,description,reward_per_worker,currency,status,payment_verified,category,workers_needed,total_budget")
  .eq("status","draft")
  .order("created_at",{ascending:false});

 if(error){
  box.innerHTML+="<p class='muted'>Tasks Error: "+safe(error.message)+"</p>";
  return;
 }

 if(!data||data.length===0){
  box.innerHTML+="<p class='muted'>কোনো Pending Task নেই।</p>";
  return;
 }

 data.forEach(task=>{
  const card=document.createElement("div");
  card.className="card";

  const title=document.createElement("h3");
  title.textContent=task.title||"Untitled Task";

  const details=document.createElement("div");
  details.className="detail";
  details.textContent=
   "Category: "+(task.category||"")+
   " | Workers: "+task.workers_needed+
   " | Reward: $"+task.reward_per_worker+
   " | Total Budget: $"+task.total_budget;

  const desc=document.createElement("p");
  desc.textContent=task.description||"";

  const payment=document.createElement("p");
  payment.className="detail";
  payment.textContent="Payment Verification: "+
   (task.payment_verified?"Verified ✓":"Not Verified");

  card.append(title,details,desc,payment);

  const rejectBtn=document.createElement("button");
  rejectBtn.textContent="Reject Task";
  rejectBtn.className="reject";
  rejectBtn.onclick=()=>rejectBuyerTask(task.id,rejectBtn);
  card.appendChild(rejectBtn);

  if(!task.payment_verified){
   const verifyBtn=document.createElement("button");
   verifyBtn.textContent="Verify Payment";
   verifyBtn.className="verify";
   verifyBtn.onclick=()=>verifyPayment(task.id,verifyBtn);

   const warning=document.createElement("p");
   warning.className="muted";
   warning.textContent="Buyer-এর পেমেন্ট বাস্তবে পাওয়ার পরেই Verify করবেন।";

   card.append(warning,verifyBtn);
  }else{
   const activateBtn=document.createElement("button");
   activateBtn.textContent="Activate Task";
   activateBtn.onclick=()=>activateTask(task.id,activateBtn);

   card.appendChild(activateBtn);
  }

  box.appendChild(card);
 });
}

async function rejectBuyerTask(id,button){
 if(!confirm("এই Task বাতিল করবেন?"))return;

 button.disabled=true;
 button.textContent="Rejecting...";

 const {data,error}=await db.rpc("reject_buyer_task",{
  p_task_id:id
 });

 if(error){
  alert("Reject failed: "+error.message);
  button.disabled=false;
  button.textContent="Reject Task";
  return;
 }

 alert(data||"Task rejected");
 await loadBuyerTasks();
}

async function verifyPayment(id,button){
 if(!confirm("Buyer-এর পেমেন্ট বাস্তবে পেয়েছেন এবং যাচাই করেছেন?"))return;

 button.disabled=true;
 button.textContent="Verifying...";

 const {data,error}=await db.rpc("verify_buyer_payment",{
  p_task_id:id
 });

 if(error){
  alert("Payment verification failed: "+error.message);
  button.disabled=false;
  button.textContent="Verify Payment";
  return;
 }

 alert(data||"Payment verified");
 await loadBuyerTasks();
}

async function activateTask(id,button){
 if(!confirm("পেমেন্ট যাচাই করা হয়েছে। এখন Task Active করবেন?"))return;

 button.disabled=true;
 button.textContent="Activating...";

 const {data,error}=await db.rpc("approve_buyer_task",{
  p_task_id:id
 });

 if(error){
  alert("Activation failed: "+error.message);
  button.disabled=false;
  button.textContent="Activate Task";
  return;
 }

 alert(data||"Task activated");
 await loadBuyerTasks();
}

async function logout(){
 if(!confirm("Logout করতে চান?"))return;
 await db.auth.signOut();
 location.href="login.html";
}

start();
</script>
</body>
 </html>
