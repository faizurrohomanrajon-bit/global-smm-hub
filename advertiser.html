<!DOCTYPE html><html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Buyer Job Post - GLOBAL EARNING</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#111c30;border-bottom:1px solid #26364e}
header h2{margin:0;color:#f5c76b}
.container{max-width:650px;margin:25px auto;padding:16px}
.card{background:#111c30;border:1px solid #26364e;border-radius:16px;padding:20px}
h3{margin-top:0;color:#f5c76b}
label{display:block;margin:15px 0 7px;color:#dce5f3}
input,textarea{width:100%;padding:13px;border-radius:9px;border:1px solid #35465f;background:#0b1628;color:white;font-size:15px}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:14px;margin-top:20px;background:#f5c76b;color:#111827;border:0;border-radius:9px;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
.info{background:#172943;padding:13px;border-radius:9px;color:#cbd5e1;font-size:14px;line-height:1.6}
.total{font-size:18px;color:#4ade80;font-weight:bold;margin-top:15px}
#message{margin-top:15px;line-height:1.6}
.back{display:inline-block;margin-top:18px;color:#f5c76b;text-decoration:none}
</style>
</head>
<body><header>
<h2>GLOBAL EARNING 🌍</h2>
<p>Buyer Job Posting</p>
</header><div class="container">
<div class="card">
<h3>নতুন কাজ পোস্ট করুন</h3><div class="info">
যেকোনো বৈধ কাজ পোস্ট করতে পারবেন। কাজটি Admin যাচাই ও অনুমোদন না করা পর্যন্ত Worker-দের কাছে প্রকাশ হবে না।
</div><form id="jobForm"><label>কাজের ক্যাটাগরি</label>
<input id="category" type="text" placeholder="যেমন: Typing, Design, Translation" required>

<label>কাজের শিরোনাম</label>
<input id="title" type="text" placeholder="কাজের নাম লিখুন" required>

<label>কাজের বিস্তারিত বিবরণ</label>

<textarea id="description" placeholder="কী কাজ করতে হবে বিস্তারিত লিখুন" required></textarea><label>কাজের লিংক (ঐচ্ছিক)</label>
<input id="jobUrl" type="url" placeholder="https://example.com">

<label>কাজের নির্দেশনা ও শর্ত</label>

<textarea id="requirements" placeholder="Worker-কে কীভাবে কাজ জমা দিতে হবে লিখুন"></textarea><label>প্রতি Worker-এর পারিশ্রমিক (USD)</label>
<input id="reward" type="number" min="0.01" step="0.01" placeholder="যেমন: 2.00" required>

<label>কতজন Worker প্রয়োজন?</label>
<input id="workers" type="number" min="1" step="1" value="1" required>

<div class="total">
মোট বাজেট: $<span id="totalBudget">0.00</span>
</div><button type="submit" id="submitBtn">কাজ পোস্ট করুন</button>

</form><div id="message"></div>
<a class="back" href="dashboard.html">← Dashboard-এ ফিরে যান</a>
</div>
</div><script>
const SUPABASE_URL = "https://hbvtnlwwafmwdfaibrrz.supabase.co";
const SUPABASE_KEY = "sb_publishable_PBEsz-_TswIKq8W3rTFaOg_UVAbfPTk";

const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const rewardInput = document.getElementById("reward");
const workersInput = document.getElementById("workers");
const totalBudget = document.getElementById("totalBudget");
const message = document.getElementById("message");
const submitBtn = document.getElementById("submitBtn");

function calculateBudget(){
 const reward=Number(rewardInput.value)||0;
 const workers=Number(workersInput.value)||0;
 totalBudget.textContent=(reward*workers).toFixed(2);
}

rewardInput.addEventListener("input",calculateBudget);
workersInput.addEventListener("input",calculateBudget);

async function getCurrentUser(){
 const {data,error}=await db.auth.getUser();
 if(error||!data.user)return null;
 return data.user;
}

document.getElementById("jobForm").addEventListener("submit",async function(e){
 e.preventDefault();

 const user=await getCurrentUser();

 if(!user){
  message.textContent="প্রথমে Login করুন।";
  message.style.color="#fca5a5";
  return;
 }

 const category=document.getElementById("category").value.trim();
 const title=document.getElementById("title").value.trim();
 const description=document.getElementById("description").value.trim();
 const jobUrl=document.getElementById("jobUrl").value.trim();
 const requirements=document.getElementById("requirements").value.trim();
 const reward=Number(rewardInput.value);
 const workers=Number(workersInput.value);
 const budget=Number((reward*workers).toFixed(2));

 if(!category||!title||!description||reward<0.01||
    !Number.isInteger(workers)||workers<1||!Number.isFinite(budget)){
  message.textContent="সব তথ্য সঠিকভাবে পূরণ করুন।";
  message.style.color="#fca5a5";
  return;
 }

 if(jobUrl){
  try{
   const parsed=new URL(jobUrl);
   if(!["http:","https:"].includes(parsed.protocol)){
    throw new Error("Invalid URL");
   }
  }catch(e){
   message.textContent="সঠিক https:// অথবা http:// লিংক দিন।";
   message.style.color="#fca5a5";
   return;
  }
 }

 submitBtn.disabled=true;
 submitBtn.textContent="জমা হচ্ছে...";
 message.textContent="";

 const {error}=await db.from("tasks").insert({
  buyer_id:user.id,
  category:category,
  title:title,
  description:description,
  job_url:jobUrl||null,
  requirements:requirements,
  reward_per_worker:reward,
  workers_needed:workers,
  total_budget:budget,
  currency:"USD",
  status:"draft",
  payment_verified:false
 });

 if(error){
  message.textContent="কাজ জমা হয়নি: "+error.message;
  message.style.color="#fca5a5";
  submitBtn.disabled=false;
  submitBtn.textContent="কাজ পোস্ট করুন";
  return;
 }

 message.textContent="✓ কাজের পোস্ট জমা হয়েছে। Admin Review-এর অপেক্ষায় আছে।";
 message.style.color="#4ade80";

 document.getElementById("jobForm").reset();
 workersInput.value="1";
 calculateBudget();

 submitBtn.disabled=false;
 submitBtn.textContent="কাজ পোস্ট করুন";
});
</script></body>
</html>
