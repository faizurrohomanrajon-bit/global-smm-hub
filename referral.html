
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">
<title>Referral | GLOBAL EARNING</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#08090d;color:#fff;font-family:Arial,sans-serif;padding-bottom:80px}
header{background:#11131b;padding:22px 17px;border-bottom:1px solid #292b35}
h2{margin:0;color:#ff9b35}
header p{color:#aaa;font-size:13px;margin:8px 0 0}
main{max-width:650px;margin:auto;padding:16px}
.card{background:#151720;border:1px solid #292b35;border-radius:14px;padding:17px;margin-bottom:14px}
.label{color:#aaa;font-size:13px}
.value{font-size:25px;font-weight:bold;color:#ff9b35;margin-top:9px}
input{width:100%;padding:13px;border-radius:9px;border:1px solid #393c48;background:#0c0e15;color:white;margin:12px 0}
button{background:#ff982e;color:#111;border:0;border-radius:9px;padding:12px 17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.note{color:#aaa;font-size:12px;line-height:1.6;margin-top:12px;overflow-wrap:anywhere}
nav{position:fixed;bottom:0;left:0;right:0;background:#11131b;border-top:1px solid #292b35;display:flex;justify-content:space-around;padding:13px 5px}
nav a{color:#bbb;text-decoration:none;font-size:12px}
nav a.current{color:#ff9b35}
</style>
</head>

<body>

<header>
<h2>GLOBAL EARNING 🌍</h2>
<p>Invite Friends & Grow Together</p>
</header>

<main>

<div class="card">
<div class="label">Your Referral Link</div>

<input id="refLink" readonly placeholder="Loading referral link...">

<button id="copyBtn">Copy Referral Link</button>

<div id="message" class="note"></div>
</div>

<div class="card">
<div class="label">Total Referrals</div>
<div class="value" id="refCount">Loading...</div>
</div>

<div class="card">
<div class="label">Referral Earnings</div>
<div class="value" id="refEarnings">$0.00</div>
<p class="note">
শুধু যাচাইকৃত ও সম্পন্ন Referral Commission এখানে দেখানো হবে।
</p>
</div>

</main>

<nav>
<a href="dashboard.html">Home</a>
<a href="tasks.html">Tasks</a>
<a href="referral.html" class="current">Referral</a>
<a href="wallet.html">Wallet</a>
</nav>

<script>

const SUPABASE_URL="https://hbvtnlwwafmwdfaibrrz.supabase.co";

const SUPABASE_KEY="sb_publishable_PBEsz-_TswIKq8W3rTFaOg_UVAbfPTk";

const db=window.supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

const el=id=>document.getElementById(id);

function showMessage(text){
 el("message").textContent=text;
}

async function start(){

 const refCount=el("refCount");
 const earnings=el("refEarnings");

 try{

  const {data:sessionData,error:authError}=await db.auth.getUser();

  if(authError)throw authError;

  const user=sessionData.user;

  if(!user){
   location.replace("login.html");
   return;
  }

  // Referral Link
  const link=
   location.origin+
   "/login.html?ref="+
   encodeURIComponent(user.id);

  el("refLink").value=link;

  // Total Referral Count
  const {data:count,error:countError}=await db.rpc(
   "get_my_referral_count"
  );

  if(countError)throw countError;

  refCount.textContent=Number(count||0);

  // All completed referral commissions
  const {data:transactions,error:txError}=await db
   .from("wallet_transactions")
   .select("amount")
   .eq("user_id",user.id)
   .eq("type","referral")
   .eq("status","completed")
   .eq("currency","USD");

  if(txError)throw txError;

  const total=(transactions||[]).reduce(
   (sum,item)=>sum+Number(item.amount||0),
   0
  );

  earnings.textContent="$"+total.toFixed(2);

 }catch(error){

  console.error("Referral Error:",error);

  refCount.textContent="লোড হয়নি";
  earnings.textContent="লোড হয়নি";

  showMessage(
   "Referral তথ্য লোড করতে সমস্যা হয়েছে।"
  );

 }

}

async function copyLink(){

 const input=el("refLink");

 if(!input.value){
  showMessage("Referral Link এখনো তৈরি হয়নি।");
  return;
 }

 try{

  await navigator.clipboard.writeText(input.value);

  showMessage("Referral Link সফলভাবে Copy হয়েছে।");

 }catch(error){

  input.focus();
  input.select();

  showMessage("লিংকটি নির্বাচন করা হয়েছে। Copy করুন।");

 }

}

el("copyBtn").addEventListener("click",copyLink);

start();

</script>

</body>
</html>
