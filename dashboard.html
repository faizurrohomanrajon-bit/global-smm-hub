
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global SMM Hub - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1120;color:#fff;font-family:Arial,sans-serif}
header{padding:20px;background:#111c30;border-bottom:1px solid #26334b}
h2{margin:0;color:#4ade80}
main{padding:18px;max-width:700px;margin:auto}
.card{background:#172338;padding:20px;border-radius:14px;margin:15px 0}
.balance{display:flex;gap:12px}
.balance .card{flex:1}
.amount{font-size:25px;color:#4ade80;margin-top:12px}
button{width:100%;padding:14px;border:0;border-radius:9px;background:#4ade80;color:#07111d;font-weight:bold;margin-top:10px}
nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav button{background:#263750;color:white}
.small{color:#aab7ca;font-size:13px}
</style>
</head>
<body>
<header>
<h2>GLOBAL SMM HUB 🌍</h2>
<p class="small">Customer Dashboard</p>
</header>
<main>
<div class="card">
<h3>Welcome!</h3>
<p id="email">Loading account...</p>
</div>

<div class="balance">
<div class="card">
<div class="small">BDT Balance</div>
<div class="amount">৳0.00</div>
</div>
<div class="card">
<div class="small">USD Balance</div>
<div class="amount">$0.00</div>
</div>
</div>

<div class="card">
<h3>Dashboard Menu</h3>
<nav>
<button onclick="alert('Services coming soon')">Services</button>
<button onclick="alert('Orders coming soon')">My Orders</button>
<button onclick="alert('Wallet coming soon')">Wallet</button>
<button onclick="alert('API integration coming soon')">API Provider</button>
<button onclick="alert('Reseller system coming soon')">Reseller</button>
<button onclick="alert('Admin panel coming soon')">Admin Panel</button>
</nav>
</div>

<button onclick="logout()">Logout</button>
</main>

<script>
const SUPABASE_URL = "https://hbvtnlwwafmwdfaibrrz.supabase.co";
const SUPABASE_KEY = "sb_publishable_PBEsz-_TswIKq8W3rTFaOg_UVAbfPTk";
const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function checkLogin(){
  const {data,error} = await supabaseClient.auth.getUser();
  if(error || !data.user){
    window.location.href = "login.html";
    return;
  }
  document.getElementById("email").textContent = data.user.email;
}

async function logout(){
  await supabaseClient.auth.signOut();
  window.location.href = "login.html";
}

checkLogin();
</script>
</body>
  </html>
