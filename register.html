
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080f1d">
<title>Register | GLOBAL SMM HUB</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#080f1d;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.container{width:100%;max-width:450px}
.logo{text-align:center;margin-bottom:25px;font-size:24px;font-weight:bold;color:#4ade80}
.card{background:#111e30;border:1px solid #263951;border-radius:20px;padding:30px}
h1{text-align:center;font-size:29px;margin-bottom:10px}
.sub{text-align:center;color:#94a3b8;font-size:14px;margin-bottom:27px}
label{display:block;margin-bottom:8px;font-size:14px}
input{width:100%;padding:14px;background:#091424;border:1px solid #34445b;border-radius:9px;color:white;font-size:15px;margin-bottom:17px}
button{width:100%;padding:15px;border:0;border-radius:9px;background:#16a34a;color:white;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.message{text-align:center;margin-top:15px;font-size:13px;line-height:1.6}
.links{text-align:center;margin-top:22px;color:#94a3b8;font-size:14px}
a{color:#4ade80;text-decoration:none}
.home{text-align:center;margin-top:23px;color:#94a3b8;font-size:14px}
.referral{display:none;background:#0b2a25;border:1px solid #176b4b;border-radius:10px;padding:14px;margin-bottom:22px}
.referral small{display:block;color:#9ca3af;margin-bottom:7px}
.referral strong{display:block;color:#4ade80;font-size:13px;overflow-wrap:anywhere}
.referral .valid{color:#4ade80;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div class="container">
<div class="logo">🌍 GLOBAL SMM HUB</div>
<div class="card">
<h1>Create Account</h1>
<p class="sub">Join our global marketing platform</p>

<div class="referral" id="referralBox">
<small>You were invited by</small>
<strong id="referralId"></strong>
<div class="valid">✓ Referral link detected</div>
</div>

<form id="registerForm">
<label>Full Name</label>
<input type="text" id="name" placeholder="Enter your full name" required>

<label>Email Address</label>
<input type="email" id="email" placeholder="Enter your email" required>

<label>Password</label>
<input type="password" id="password" placeholder="Create a password" minlength="8" required>

<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="Confirm your password" minlength="8" required>

<button type="submit" id="registerBtn">CREATE ACCOUNT →</button>
<div class="message" id="message"></div>
</form>

<div class="links">
Already have an account? <a href="login.html">Login</a>
</div>
</div>
<div class="home"><a href="index.html">← Back to Homepage</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://hbvtnlwwafmwdfaibrrz.supabase.co";
const SUPABASE_KEY = "sb_publishable_PBEsz-_TswIKq8W3rTFaOg_UVAbfPTk";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// Referral ID যাচাই ও দেখানো
const referrerId = new URLSearchParams(location.search).get("ref");
const validRef = referrerId &&
  /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(referrerId);

if (validRef) {
  document.getElementById("referralBox").style.display = "block";
  document.getElementById("referralId").textContent = referrerId;
}

document.getElementById("registerForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirmPassword").value;
  const message = document.getElementById("message");
  const button = document.getElementById("registerBtn");

  if (password !== confirm) {
    message.style.color = "#f87171";
    message.textContent = "Passwords do not match.";
    return;
  }

  button.disabled = true;
  button.textContent = "PLEASE WAIT...";
  message.textContent = "";

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: { full_name: name }
      }
    });

    if (error) throw error;

    if (validRef && data.session && data.user) {
      const { error: refError } = await supabaseClient.rpc(
        "attach_referral",
        { p_referrer: referrerId }
      );

      if (refError) {
        console.error("Referral save error:", refError.message);
        message.style.color = "#f87171";
        message.textContent = "Account created, but referral could not be saved.";
        return;
      }
    }

    message.style.color = "#4ade80";
    message.textContent = "Account created successfully! Please login.";

    document.getElementById("registerForm").reset();

    const loginUrl = validRef
      ? "login.html?ref=" + encodeURIComponent(referrerId)
      : "login.html";

    setTimeout(() => {
      window.location.href = loginUrl;
    }, 1800);

  } catch (error) {
    message.style.color = "#f87171";
    message.textContent = error.message;
  } finally {
    button.disabled = false;
    button.textContent = "CREATE ACCOUNT →";
  }
});
</script>
</body>
  </html>
